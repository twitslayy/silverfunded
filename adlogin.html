<!DOCTYPE html>
<html lang="en">
<head>





<link rel="icon" href="/favicon.png">



  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Silver Funded</title>
<meta name="description" content="Secure administrator sign-in for Silver Funded operations.">
<meta property="og:title" content="Admin Login — Silver Funded">
<meta property="og:description" content="Secure administrator sign-in for Silver Funded operations.">
<meta property="og:type" content="website">
<meta property="og:image" content="/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Admin Login — Silver Funded">
<meta name="twitter:description" content="Secure administrator sign-in for Silver Funded operations.">
<meta name="twitter:image" content="/og-image.png">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="canonical" href="https://silverfunded.com/adlogin">
  
  
  <link rel="stylesheet" href="/styles.css">
  <script src="/data.js"></script>
  <style>
    body { background: var(--bg-alt); display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-box { background:#fff; border:1px solid var(--border); border-radius:var(--rxl); padding:2.5rem; width:100%; max-width:420px; box-shadow:var(--shadow-lg); }
  </style>
</head>
<body>
<div id="toast-container"></div>

<div class="login-box">
  <!-- Logo -->
  <div style="text-align:center;margin-bottom:2rem;">
    <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));display:flex;align-items:center;justify-content:center;margin:0 auto .875rem;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M2 17L12 22L22 17" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M2 12L12 17L22 12" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 style="font-family:'Syne',sans-serif;font-weight:700;font-size:1.3rem;color:var(--text);">Silver Funded</h1>
    <p style="color:var(--text-3);font-size:.85rem;margin-top:4px;">Admin panel — restricted access</p>
  </div>

  <form id="login-form" style="display:flex;flex-direction:column;gap:1.1rem;">
    <div class="form-group">
      <label class="form-label" for="admin-id">Admin ID</label>
      <input class="form-input" type="text" id="admin-id" placeholder="Enter admin ID" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="admin-pass">Password</label>
      <div style="position:relative;">
        <input class="form-input" type="password" id="admin-pass" placeholder="Enter password" autocomplete="current-password" required style="padding-right:44px;">
        <button type="button" id="toggle-pass" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);">
          <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div id="login-error" style="display:none;background:var(--red-bg);border:1px solid var(--red-br);border-radius:var(--r);padding:.75rem 1rem;color:var(--red);font-size:.82rem;">
      Incorrect admin ID or password. Please try again.
    </div>

    <button type="submit" class="btn btn-blue btn-lg" style="width:100%;margin-top:.25rem;">Sign in to Admin Panel</button>
  </form>

  <div style="border-top:1px solid var(--border-lt);margin-top:1.75rem;padding-top:1rem;text-align:center;">
    <a href="/" style="color:var(--text-3);font-size:.82rem;text-decoration:none;" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color='var(--text-3)'">← Back to Silver Funded</a>
  </div>
</div>

<script>
  // Toggle password visibility
  document.getElementById('toggle-pass').addEventListener('click', () => {
    const inp = document.getElementById('admin-pass');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });

  // Login form
  document.getElementById('login-form').addEventListener('submit', e => {
    e.preventDefault();
    const id   = document.getElementById('admin-id').value.trim();
    const pass = document.getElementById('admin-pass').value;
    const errEl= document.getElementById('login-error');

    const admins = DB.getAdmins();
    const match  = admins.find(a => a.id === id && a.password === pass);

    if (match) {
      DB.setSession({ type:'admin', adminId: match.id, name: match.name, role: match.role });
      window.location.href = '/admin';
    } else {
      errEl.style.display = 'block';
      document.getElementById('admin-pass').value = '';
    }
  });

  // Redirect if already logged in as admin
  const sess = DB.getSession();
  if (sess && sess.type === 'admin') window.location.href = '/admin';
</script>
</body>
</html>
